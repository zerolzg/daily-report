<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>市场复盘</title>
    <link rel="icon" href="./favicon.png" />
    <script type="module" crossorigin src="./assets/index-CSV5ZBq6.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C19TlIlW.css">
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-left">
          <h1 class="title">市场复盘</h1>
          <span id="lastUpdate" class="last-update" aria-live="polite">
            <span class="dot"></span>数据加载中
          </span>
        </div>
        <button id="themeToggle" class="theme-toggle" aria-label="切换主题">
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </header>

      <main class="main">
        <!-- 市场概览横幅 -->
        <section id="marketBanner" class="market-banner" aria-label="市场概览">
          <div class="banner-skeleton">
            <div class="skeleton-item skeleton-text"></div>
            <div class="skeleton-item skeleton-text skeleton-short"></div>
            <div class="skeleton-item skeleton-text"></div>
            <div class="skeleton-item skeleton-text skeleton-short"></div>
          </div>
          <div id="marketStats" class="banner-stats hidden"></div>
        </section>

        <!-- 全球资产排名 -->
        <article class="card" aria-label="全球资产排名">
          <div class="card-header">
            <h2 class="card-title">全球资产排名</h2>
          </div>
          <div class="card-skeleton"><div class="skeleton-chart"></div></div>
          <div id="rankChart" class="rank-chart hidden"></div>
        </article>

        <!-- 全球指数 -->
        <article class="card" aria-label="全球指数">
          <div class="card-header">
            <h2 class="card-title">全球指数</h2>
            <div class="segmented" id="indicesWindow" role="group" aria-label="时间维度">
              <button class="segment-btn active" data-window="today" aria-pressed="true">今日</button>
              <button class="segment-btn" data-window="7" aria-pressed="false">7天</button>
              <button class="segment-btn" data-window="30" aria-pressed="false">30天</button>
            </div>
          </div>
          <div class="card-skeleton"><div class="skeleton-chart"></div></div>
          <div id="indicesContent" class="indices-content hidden"></div>
        </article>

        <!-- 热力图：美股 / 中概股 -->
        <div class="heatmap-row">
          <article class="card" aria-label="美股热门">
            <div class="card-header">
              <h2 class="card-title">美股热门</h2>
              <div class="card-controls">
                <div class="segmented" id="usWindow" role="group" aria-label="时间维度">
                  <button class="segment-btn active" data-window="today" aria-pressed="true">今日</button>
                  <button class="segment-btn" data-window="7" aria-pressed="false">7天</button>
                  <button class="segment-btn" data-window="30" aria-pressed="false">30天</button>
                </div>
                <div class="segmented" id="usSort" role="group" aria-label="排序方式">
                  <button class="segment-btn" data-sort="change" aria-pressed="false">按涨跌</button>
                  <button class="segment-btn active" data-sort="marketCap" aria-pressed="true">按市值</button>
                </div>
              </div>
            </div>
            <div class="card-skeleton">
              <div class="skeleton-grid">
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
              </div>
            </div>
            <div id="usHeatmap" class="heatmap-content hidden"></div>
          </article>

          <article class="card" aria-label="中概股行情">
            <div class="card-header">
              <h2 class="card-title">中概股行情</h2>
              <div class="card-controls">
                <div class="segmented" id="chinaWindow" role="group" aria-label="时间维度">
                  <button class="segment-btn active" data-window="today" aria-pressed="true">今日</button>
                  <button class="segment-btn" data-window="7" aria-pressed="false">7天</button>
                  <button class="segment-btn" data-window="30" aria-pressed="false">30天</button>
                </div>
                <div class="segmented" id="chinaSort" role="group" aria-label="排序方式">
                  <button class="segment-btn" data-sort="change" aria-pressed="false">按涨跌</button>
                  <button class="segment-btn active" data-sort="marketCap" aria-pressed="true">按市值</button>
                </div>
              </div>
            </div>
            <div class="card-skeleton">
              <div class="skeleton-grid">
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
                <div class="skeleton-item skeleton-heatmap"></div>
              </div>
            </div>
            <div id="chinaHeatmap" class="heatmap-content hidden"></div>
          </article>
        </div>
      </main>

      <footer class="footer">数据来源：金十数据 · TradingView · 仅供参考，不构成投资建议</footer>
    </div>

  </body>
</html>
